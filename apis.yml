name: eBureau
description: >-
  eBureau was a predictive analytics and big-data scoring company founded in 2004 and headquartered in
  St. Cloud, Minnesota, providing real-time predictive scores, identity verification, and fraud-prevention
  products (eScore, eIDverifier, eIDcompare) to lenders, insurers, and marketers. eBureau was acquired by
  TransUnion in December 2015 and its capabilities were absorbed into TransUnion's fraud and identity
  solutions; the ebureau.com domain remains live (behind Cloudflare) but exposes no independent public
  developer portal, API reference, or machine-readable API specification. This API Evangelist profile was
  surfaced as a portfolio company of Redpoint Ventures and enriched with a live domain-security probe.
